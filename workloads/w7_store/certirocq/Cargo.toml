[package]
name = "w7_store-c"
description = "W7 credential store, variant C: Rocq → CertiRocq → C (gcc -Os), CertiRocq runtime on a fixed arena."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "w7_store-c"
test = false
bench = false

[dependencies]
bench_harness = { workspace = true, features = ["certirocq"] }
cortex-m = { workspace = true }
cortex-m-rt = { workspace = true }
panic-halt = { workspace = true }

[build-dependencies]
bench_build = { workspace = true, features = ["certirocq"] }
