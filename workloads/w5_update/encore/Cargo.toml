[package]
name = "w5_update-e"
description = "W5 A/B firmware update, variant E: Rocq → Scheme → Encore bytecode on encore_vm."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "w5_update-e"
test = false
bench = false

[features]
# Heap peak and VM op counts. Adds a counter to the dispatch loop, so the
# runner enables it only for the memory profile, never for timing.
stats = ["encore_vm/stats"]

[dependencies]
bench_harness = { workspace = true }
encore_vm = { workspace = true }
cortex-m = { workspace = true }
cortex-m-rt = { workspace = true }
panic-halt = { workspace = true }

[build-dependencies]
bench_build = { workspace = true, features = ["encore"] }
