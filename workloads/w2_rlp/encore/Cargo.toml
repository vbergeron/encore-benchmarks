[package]
name = "w2_rlp-e"
description = "W2 RLP, variant E: Rocq → Scheme → Encore bytecode on encore_vm."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "w2_rlp-e"
test = false
bench = false

[features]
# Heap peak, VM op counts and GC activity (count, reclaimed and live bytes,
# pauses timed by the board's clock). Adds a counter to the dispatch loop, so
# the runner enables it only for the memory profile, never for timing.
stats = ["encore_vm/stats", "bench_harness/encore-stats"]

[dependencies]
bench_harness = { workspace = true }
encore_vm = { workspace = true }
cortex-m = { workspace = true }
cortex-m-rt = { workspace = true }
panic-halt = { workspace = true }

[build-dependencies]
bench_build = { workspace = true, features = ["encore"] }
