name: CI

on:
  push:
  pull_request:

jobs:
  rocq:
    name: Rocq proofs and extraction
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # In the rocq/rocq-prover:9.1 image, as `docker/rocq.sh` does locally:
      # builds the theories and fails if a promoted .scm is out of date.
      - name: Build theories and check the promoted Scheme
        run: docker/rocq.sh check

  firmware:
    name: Harness tests and QEMU smoke
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install QEMU and the ARM C compiler (C variants)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends qemu-system-arm gcc-arm-none-eabi
      - name: Toolchain (from rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Host tests (harness, build helper, runner)
        run: cargo test
      - name: Workloads on QEMU (Cortex-M3 and Cortex-M33)
        run: |
          for w in w0_smoke w1_apdu w2_rlp w3_policy w4_pin w6_cobs w7_store; do
            for board in qemu-lm3s6965 qemu-an505; do
              for v in r e; do
                cargo xtask run -w "$w" -v "$v" -b "$board" --out ci.jsonl
              done
              cargo xtask run -w "$w" -v e -b "$board" --profile memory --out ci.jsonl
            done
          done
          for w in w0_smoke w1_apdu w2_rlp w4_pin w6_cobs; do
            for board in qemu-lm3s6965 qemu-an505; do
              cargo xtask run -w "$w" -v c -b "$board" --out ci.jsonl
            done
          done
      - name: Every variant matches the R oracle
        run: cargo xtask check --results ci.jsonl
      - uses: actions/upload-artifact@v4
        with:
          name: ci-results
          path: ci.jsonl
