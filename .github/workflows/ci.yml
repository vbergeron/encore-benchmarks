name: CI

on:
  push:
  pull_request:

jobs:
  rocq:
    name: Rocq proofs and extraction
    runs-on: ubuntu-24.04
    # The image's opam switch belongs to its non-root user (uid 1000), but
    # actions/checkout needs root to write the runner's files: run the
    # container as root and drop to that user for the build.
    container:
      image: rocq/rocq-prover:9.1
      options: --user root
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      # rocq-encore (Encore.Extraction) is the only thing installed on top of
      # the image. Its compiled theory is cached, keyed on the image's Rocq
      # and Stdlib versions (.vo files are only valid for those) and on the
      # pinned Encore commit, so a cache hit skips opam altogether.
      - name: Key for the rocq-encore cache
        id: rocq-encore-key
        run: |
          user="$(getent passwd 1000 | cut -d: -f1)"
          echo "user=${user:?no uid 1000 user in the image}" >> "$GITHUB_OUTPUT"
          versions="$(su "$user" -s /bin/bash -c 'eval "$(opam env)" && rocq --version && opam show -f version rocq-stdlib')"
          echo "$versions"
          echo "key=rocq-encore-$(echo "$versions" | sha256sum | cut -c1-16)-${{ hashFiles('encore-benchmarks.opam.template') }}" >> "$GITHUB_OUTPUT"
      - name: Restore rocq-encore
        id: rocq-encore-cache
        uses: actions/cache@v4
        with:
          path: .ci-cache/rocq-encore
          key: ${{ steps.rocq-encore-key.outputs.key }}
      - name: Build theories and re-extract
        env:
          ROCQ_USER: ${{ steps.rocq-encore-key.outputs.user }}
          CACHE_HIT: ${{ steps.rocq-encore-cache.outputs.cache-hit }}
        run: |
          echo "building as $ROCQ_USER"
          chown -R "$ROCQ_USER" "$GITHUB_WORKSPACE"
          # On a miss, --deps-only installs rocq-encore from the pin-depends
          # of encore-benchmarks.opam (Rocq and Stdlib are already in the
          # image), and the installed theory is saved for the cache. The
          # image pins rocq-stdlib 9.0.0, which works with Rocq 9.1 but fails
          # the ">= 9.1" bound of both opam files: keep the image's.
          su "$ROCQ_USER" -s /bin/bash -c '
            set -euo pipefail
            cd "$GITHUB_WORKSPACE"
            eval "$(opam env)"
            contrib="$(rocq c -where)/user-contrib"
            if [ "$CACHE_HIT" = true ]; then
              cp -r .ci-cache/rocq-encore/Encore "$contrib/"
            else
              opam install -y --deps-only --ignore-constraints-on=rocq-stdlib .
              mkdir -p .ci-cache/rocq-encore
              cp -r "$contrib/Encore" .ci-cache/rocq-encore/
            fi
            rocq --version
            dune build'
      - name: Promoted Scheme is up to date
        run: git -c safe.directory='*' diff --exit-code -- 'workloads/*/theories/*.scm'

  firmware:
    name: Harness tests and QEMU smoke
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install QEMU and the ARM C compiler (C variants)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends qemu-system-arm gcc-arm-none-eabi
      - name: Toolchain (from rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Host tests (harness, build helper, runner)
        run: cargo test
      - name: Workloads on QEMU (Cortex-M3 and Cortex-M33)
        run: |
          for w in w0_smoke w4_pin w6_cobs; do
            for board in qemu-lm3s6965 qemu-an505; do
              for v in r e; do
                cargo xtask run -w "$w" -v "$v" -b "$board" --out ci.jsonl
              done
              cargo xtask run -w "$w" -v e -b "$board" --profile memory --out ci.jsonl
            done
          done
          for w in w4_pin w6_cobs; do
            for board in qemu-lm3s6965 qemu-an505; do
              cargo xtask run -w "$w" -v c -b "$board" --out ci.jsonl
            done
          done
      - name: Every variant matches the R oracle
        run: cargo xtask check --results ci.jsonl
      - uses: actions/upload-artifact@v4
        with:
          name: ci-results
          path: ci.jsonl
