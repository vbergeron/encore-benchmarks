[package]
name = "bench_harness"
description = "Device-side measurement harness: cycle/instruction regions, stack painting, JSONL records."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["semihosting"]
# Output and exit through ARM semihosting (QEMU, or a probe with semihosting).
semihosting = ["dep:cortex-m-semihosting"]
# Calling CertiRocq-generated C and reading its values (C variants).
certirocq = []
# encore_vm statistics of one run (VM ops, heap peak, GC) and the clock that
# times the GC (E variants, memory profile only).
encore-stats = ["dep:encore_vm", "encore_vm/stats", "dep:cortex-m-rt"]

[dependencies]
encore_vm = { workspace = true, optional = true }

[target.'cfg(all(target_arch = "arm", target_os = "none"))'.dependencies]
cortex-m = { workspace = true }
cortex-m-semihosting = { workspace = true, optional = true }
cortex-m-rt = { workspace = true, optional = true }
