[workspace]
resolver = "3"
members = [
    "crates/bench_harness",
    "crates/bench_build",
    "xtask",
    "workloads/*/rust",
    "workloads/*/encore",
    "workloads/*/certirocq",
]
# `cargo build` / `cargo test` with no flags only touch host-buildable crates.
# Firmware is built by `cargo xtask` with an explicit --target.
default-members = ["crates/bench_harness", "crates/bench_build", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

# One set of versions for every variant, so they differ only in their logic.
[workspace.dependencies]
bench_harness = { path = "crates/bench_harness" }
bench_build = { path = "crates/bench_build" }
encore_vm = { version = "=0.1.6", features = ["derive"] }
encore_compiler = "=0.1.6"
encore_scheme = "=0.1.6"
cortex-m = "0.7"
cortex-m-rt = "0.7"
cortex-m-semihosting = "0.5"
panic-halt = "1.0"

# Identical codegen settings for all variants (PLAN.md: gcc -Os on the C side).
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
debug = true   # symbols only; needed by the size breakdown, not flashed

[profile.dev]
panic = "abort"

# encore 0.1.6 is not on crates.io yet: take it from the release commit.
# Drop this section (and `cargo update -p encore_vm`) once it is published.
[patch.crates-io]
encore_vm = { git = "https://github.com/vbergeron/encore", rev = "d8e32a19a2a6c31e7536f46aa5aa532c7e8cf368" }
encore_compiler = { git = "https://github.com/vbergeron/encore", rev = "d8e32a19a2a6c31e7536f46aa5aa532c7e8cf368" }
encore_scheme = { git = "https://github.com/vbergeron/encore", rev = "d8e32a19a2a6c31e7536f46aa5aa532c7e8cf368" }
encore_derive = { git = "https://github.com/vbergeron/encore", rev = "d8e32a19a2a6c31e7536f46aa5aa532c7e8cf368" }
